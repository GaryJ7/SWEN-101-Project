<!-- This is the transportation page-->
<!DOCTYPE html>
<html>

    
    <h1 style="text-align: center; font-size: 5rem; font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif">TRANSPORTATION</h1>

    <body>
        <!--This is the map and orange box-->
        <div style="width: 450px; height: 600px; background-color: #dc6a13; color: white; padding: 20px; border-radius: 15px; position: fixed; top: 20%; z-index: 11001">
            <iframe 
            src="https://maps.rit.edu/" 
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
        <!--This is the driver drop down menu-->
        <div style="position: fixed; top: 20%; left: 63%; transform: translateX(-50%); width: 100%; max-width: 800px; height: 200px; background: white; box-shadow: 0px 4px 15px rgba(234, 108, 5, 0.2); padding: 20px; border-radius: 8px; z-index: 9999; font-size: 70px; text-align: center; font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif">
            <label for="driver">Choose a driver:</label>

                <select style="width: 100%; height: 80px; font-size: 28px; padding: 10px 20px; font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; border-radius: 8px; cursor: pointer;" id="driver" name="driver">
                <option style="font-size: 28px; padding: 15px;font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif" value="driver">Gary</option>
                <option style="font-size: 28px; padding: 15px;font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif" value="driver">Ze Nan</option>
                <option style="font-size: 28px; padding: 15px;font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif" value="driver">Zach</option>
                <option style="font-size: 28px; padding: 15px;font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif" value="driver">Dan Krutz</option>
                </select>
        </div>
        <!--This is the location drop down menu-->
        <div style="font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;position: fixed; top: 50%; left: 63%; transform: translateX(-50%); width: 100%; max-width: 800px; height: 200px; background: white; box-shadow: 0px 4px 15px rgba(234, 108, 5, 0.2); padding: 20px; border-radius: 8px; z-index: 9999; font-size: 70px; text-align: center">
            <label for="driver">Choose a location:</label>

                <select style="width: 100%; height: 80px; font-size: 28px; font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; padding: 10px 20px; border-radius: 8px; cursor: pointer;" id="location" name="location">
                <option style="font-size: 28px; padding: 15px;font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif" value="location">DSP</option>
                <option style="font-size: 28px; padding: 15px;font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif" value="location">Global Village</option>
                <option style="font-size: 28px; padding: 15px;font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif" value="location">Infinity Quad</option>
                <option style="font-size: 28px; padding: 15px;font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif" value="location">Sentinel Quad</option>
                </select>
        </div>

        <div style="font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;width: 800px; height: 50px; background-color: #dc6a13; color: white; padding: 20px; border-radius: 15px; position: fixed; top:80%; left: 35.5%; z-index: 9998; font-size: 45px; text-align: center">
            Pay up
        </div>

    </body>


</html>
