<!-- This is the transportation page-->
<!DOCTYPE html>
<html>

    <head>

        <h1 style="text-align: center; font-size: 3rem;">Transportation</h1>

    </head>

    <body>

        <div style="width: 450px; height: 600px; background-color: #dc6a13; color: white; padding: 20px; border-radius: 15px; position: relative; z-index: 10000">
            <iframe 
            src="https://maps.rit.edu/" 
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
        </div>

        <div style="position: fixed; top: 20%; left: 63%; transform: translateX(-50%); width: 100%; max-width: 800px; height: 200px; background: white; box-shadow: 0px 4px 15px rgba(234, 108, 5, 0.2); padding: 20px; border-radius: 8px; z-index: 9999; font-size: 70px; text-align: center">
            <label for="driver">Choose a driver:</label>

                <select style="width: 100%; height: 80px; font-size: 28px; padding: 10px 20px; border-radius: 8px; cursor: pointer;" id="driver" name="driver">
                <option style="font-size: 28px; padding: 15px;" value="driver">Gary</option>
                <option style="font-size: 28px; padding: 15px;" value="driver">Ze Nan</option>
                <option style="font-size: 28px; padding: 15px;" value="driver">Zach</option>
                <option style="font-size: 28px; padding: 15px;" value="driver">Dan Krutz</option>
                </select>
        </div>

    </body>


</html>
