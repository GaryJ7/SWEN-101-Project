<!-- This is the transportation page-->
<!DOCTYPE html>
<html> <!--Perhaps too many div containers-->

    <head>
        <link rel="stylesheet" href="css/transport.css">
    </head>

    <body>

        <h1 style = "font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif">
            TRANSPORTATION
        </h1>       
        <div class = "flexbox_layout">

    <!-- Map -->
    <div class = "map">
        <iframe
            src="https://maps.rit.edu/"width="100%"height="500px"style="border:0;"loading="lazy">
        </iframe>
    </div>

    <!-- Dropdown menus -->
    <div class = "dropdown_config">


        <div class = "driver_box_config">

            <label for="driver">Choose a driver:</label>

            <select id="driver" name="driver" class = "driver_text">
                <option style = "font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;"value="gary">Gary</option>
                <option style = "font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;"value="zenan">Ze Nan</option>
                <option style = "font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;"value="zach">Zach</option>
                <option style = "font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;"value="dan">Dan Krutz</option>
            </select>

        </div>

        <!-- Location -->
        <div class = "location_box">

            <label for="location">Choose a location:</label>

            <select id="location" name="location" class = location_text>
                <option style = "font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; "value="dsp">DSP</option>
                <option style = "font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; "value="global-village">Global Village</option>
                <option style = "font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; "value="infinity-quad">Infinity Quad</option>
                <option style = "font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; "value="sentinel-quad">Sentinel Quad</option>
            </select>

        </div>

    </div> <!--end of dropdown_config-->

    </div> <!-- end flexbox layout-->

        <div style="display: flex; justify-content: center; width: 100%; margin: 30px auto">
            <button class = "button_class"; type="button" onclick="window.location.href='pay_up.html'">
                    Pay Up
            </button>
        </div>

    </body>


</html>
