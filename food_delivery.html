
<!-- This is the food page-->
<!DOCTYPE html>
<html>

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/food_delivery.css">
    </head>

    <body>

        <!-- Page title -->
        <h1>
            FOOD DELIVERY
        </h1>

        <!-- Main Flexbox container -->
        <div class = "main_flexbox">

            <!-- Menu and orange box -->
            <div class = "food_map">
                <iframe
                    src="https://www.fdmealplanner.com/#RIT" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>

            <!-- Driver dropdown and Pay Up -->
            <div class = dropdown_flex>

                <!-- Driver dropdown -->
                <div class = driver_dropdown>

                    <label for="driver">Choose a driver:</label>

                    <select
                        class = "driver_text"  id="driver"  name="driver">

                        <option value="gary">Gary</option>
                        <option value="zenan">Ze Nan</option>
                        <option value="zach">Zach</option>
                        <option value="dan">Dan Krutz</option>
                    </select>
                </div>
                <!-- Pay Up section -->
                <div class = "button_style">
                    <button class = "button_text";type="button" onclick="window.location.href='pay_up.html'">
                    Pay Up
                    </button>
                </div>

            </div> <!--End of dropdown flex-->

        </div> <!---End of main flexbox-->

    </body>

</html>
