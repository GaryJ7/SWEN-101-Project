
<!-- This is the food page-->
<!DOCTYPE html>
<html>

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="transport_delivery.css">
    </head>

    <body style=" margin: 0; padding: 10px 25px; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column;">

        <!-- Page title -->
        <h1 style=" text-align: center; font-size: clamp(2rem, 4vw, 5rem); font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; margin: 5px 0 15px 0;">
            FOOD DELIVERY
        </h1>

        <!-- Main Flexbox container -->
        <div style=" display: flex; flex: 1; min-height: 0; justify-content: center; align-items: stretch; gap: 40px; width: 100%;">

            <!-- Menu and orange box -->
            <div style="flex: 1;min-width: 0;background-color: #dc6a1378;color: white; padding: 20px; border-radius: 15px;">
                <iframe
                    src="https://www.fdmealplanner.com/#RIT" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>

            <!-- Driver dropdown and Pay Up -->
            <div style=" flex: 1; min-width: 0;display: flex; flex-direction: column; justify-content: space-evenly; gap: 20px;">

                <!-- Driver dropdown -->
                <div style=" width: 100%; background: white; box-shadow: 0px 4px 15px rgba(234, 108, 5, 0.2); padding: 20px; border-radius: 8px; font-size: clamp(24px, 3vw, 50px); text-align: center; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; box-sizing: border-box; ">

                    <label for="driver">Choose a driver:</label>

                    <select
                        style="width: 100%;height: 80px;font-size: 28px;padding: 10px 20px;font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;border-radius: 8px;cursor: pointer;"  id="driver"  name="driver">

                        <option value="gary">Gary</option>
                        <option value="zenan">Ze Nan</option>
                        <option value="zach">Zach</option>
                        <option value="dan">Dan Krutz</option>

                    </select>

                </div>

                <!-- Pay Up section -->
                <div style=" width: 100%; min-height: 180px; background-color: #dc6a13; color: white; padding: 20px; border-radius: 15px; font-size: clamp(30px, 4vw, 70px); text-align: center;font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;display: flex;justify-content: center;align-items: center;box-sizing: border-box;">
                    <button style="width: 80%; max-width: 650px; min-height: 70px; font-family: 'Franklin Gothic Medium', Arial, sans-serif;";type="button" onclick="window.location.href='food_delivery.html'">
                    Pay Up
                    </button>
                </div>

            </div>

        </div>

    </body>

</html>
